<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Portafolio Web - Patricio Carpio</title>
    <script>
      // spa-github-pages redirect: encode path as query string so GitHub Pages
      // serves index.html, which then recovers the original path.
      // segmentCount = 1 for a repo-name subfolder (github.com/user/REPO).
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
